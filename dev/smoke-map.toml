  "crates/formalshell-rs/protocols/**",
  "crates/formalshell-rs/src/wayland/heads.rs",
  "crates/formalshell-rs/src/services/icons.rs",
  "crates/fs-devices/src/lib.rs",
  "crates/fs-info/src/lib.rs",
  "crates/fs-theme/**",
  "crates/fs-chrome/src/lib.rs",
  "crates/fs-chrome/src/types.rs",
