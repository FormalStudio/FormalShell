[[rule]]
paths = ["crates/formalshell-rs/src/surfaces/launcher.rs", "crates/formalshell-rs/src/surfaces/panel/appmenu.rs"]
runs = ["--launch"]

[[rule]]
paths = ["crates/fs-info/src/reminders.rs"]
runs = ["--reminder", "--menu-actions"]

[[rule]]
paths = ["crates/fs-info/src/agents.rs", "crates/formalshell-rs/src/services/agents.rs"]
runs = ["--spaces"]

# OSD
[[rule]]
paths = ["crates/formalshell-rs/src/surfaces/osd.rs", "crates/formalshell-rs/src/wayland/osd.rs", "crates/formalshell-rs/src/ipc/osd.rs"]
runs = ["--osd", "--brightness"]

# Lock, screensaver, idle
[[rule]]
paths = [
  "crates/formalshell-rs/src/surfaces/lock.rs",
  "crates/formalshell-rs/src/surfaces/login.rs",
  "crates/formalshell-rs/src/wayland/lock.rs",
  "crates/formalshell-rs/src/ipc/lock.rs",
  "crates/fs-auth/src/lib.rs",
  "crates/fs-auth/src/pam.rs",
  "crates/fs-system/src/lock.rs",
]
runs = ["--lock", "--unlock", "--lock-restore", "--lock-media", "--lock --depth", "--hotcorner-relock", "--multi-output", "--logind-lock", "--sleep", "--login-lock"]

# The veils: the arrival every run starts under, and the unlock's hand-over.
[[rule]]
paths = ["crates/formalshell-rs/src/wayland/veil.rs", "crates/formalshell-rs/src/surfaces/veil.rs", "dev/smoke.d/unlock.sh"]
runs = ["--unlock", "--lock", "--menu", "--multi-output", "--login-lock"]

# The pixel dissolve: the boot's splash into the lock, the lock into the desktop.
[[rule]]
paths = ["crates/formalshell-rs/src/surfaces/dissolve.rs", "dev/dissolve-cells.py"]
runs = ["--unlock", "--login-lock"]

[[rule]]
paths = ["crates/formalshell-rs/src/services/depth.rs", "packaging/formalshell-depth.py"]
runs = ["--lock --depth", "--desktop-clock"]

[[rule]]
paths = ["crates/formalshell-rs/src/services/sleep.rs"]
runs = ["--sleep"]

[[rule]]
paths = ["crates/formalshell-rs/src/services/session.rs"]
runs = ["--logind-lock", "--sleep", "--login-lock"]

[[rule]]
paths = ["crates/formalshell-rs/src/services/screensaver.rs", "crates/formalshell-rs/src/wayland/screensaver.rs", "crates/formalshell-rs/src/ipc/screensaver.rs", "crates/fs-screensaver/**"]
runs = ["--screensaver", "--idle", "--caffeinate"]

[[rule]]
paths = ["crates/formalshell-rs/src/services/caffeinate.rs", "crates/formalshell-rs/src/wayland/caffeinate.rs", "crates/formalshell-rs/src/ipc/caffeinate.rs"]
runs = ["--caffeinate", "--screensaver-inhibit"]

[[rule]]
paths = ["crates/formalshell-rs/src/services/inhibit.rs"]
runs = ["--screensaver-inhibit"]

[[rule]]
paths = ["crates/formalshell-rs/src/services/polkit.rs", "crates/formalshell-rs/src/wayland/polkit.rs"]
runs = ["--polkit"]

[[rule]]
paths = ["crates/formalshell-rs/src/services/power.rs", "crates/formalshell-rs/src/services/shutdown.rs", "crates/formalshell-rs/src/ipc/power.rs"]
runs = ["--power", "--login-lock"]

# Wallpaper and theme
[[rule]]
paths = ["crates/formalshell-rs/src/services/wallpaper.rs", "crates/formalshell-rs/src/services/theme.rs", "crates/formalshell-rs/src/ipc/theme.rs"]
runs = ["--wallpaper", "--theme-toggle", "--theme-auto", "--flexoki", "--glass", "--sky"]

# Hyprland's window motion off the published chrome, and the shipped
# example a hyprland.lua loads it from (a rule wins over `none`).
[[rule]]
paths = ["crates/fs-theme/src/chrome.rs", "docs/examples/hyprland/formalshell.lua"]
runs = ["--hypr-motion", "--glass-behind"]

# The sky wallpaper and the sun it is drawn for.
[[rule]]
paths = ["crates/fs-theme/src/sky.rs", "crates/fs-theme/src/sun.rs"]
runs = ["--sky", "--theme-auto"]

# Glass: the compositor's blur switch deciding the cards' opacity.
[[rule]]
paths = ["crates/formalshell-rs/src/services/compositor/hyprland/mod.rs", "dev/smoke.d/glass.sh"]
runs = ["--glass"]

[[rule]]
paths = ["crates/formalshell-rs/src/services/picker.rs", "crates/formalshell-rs/src/wayland/picker.rs", "crates/formalshell-rs/src/ipc/picker.rs"]
runs = ["--picker", "--wheel"]

[[rule]]
paths = ["crates/formalshell-rs/src/services/nightlight.rs", "crates/formalshell-rs/src/ipc/nightlight.rs"]
runs = ["--nightlight"]

[[rule]]
paths = ["crates/formalshell-rs/src/services/lights.rs", "crates/formalshell-rs/src/ipc/lights.rs", "crates/fs-system/src/lights.rs"]
runs = ["--lights"]

# Capture, recording, console
[[rule]]
paths = ["crates/formalshell-rs/src/surfaces/capture/**", "crates/formalshell-rs/src/services/capture.rs", "crates/formalshell-rs/src/ipc/capture.rs", "crates/formalshell-rs/src/ipc/screenshot.rs", "crates/fs-system/src/capture.rs"]
runs = ["--capture", "--capture-edit", "--screenshot", "--ocr"]

[[rule]]
paths = ["crates/formalshell-rs/src/services/recording.rs", "crates/formalshell-rs/src/ipc/record.rs"]
runs = ["--record", "--capture"]

[[rule]]
paths = ["crates/formalshell-rs/src/wayland/console.rs", "crates/formalshell-rs/src/ipc/console.rs", "crates/fs-system/src/console.rs"]
runs = ["--console", "--nix-run"]

[[rule]]
paths = ["crates/formalshell-rs/src/services/mirror.rs", "crates/formalshell-rs/src/services/v4l2.rs", "crates/formalshell-rs/src/ipc/mirror.rs", "crates/fs-system/src/camera.rs"]
runs = ["--mirror"]

[[rule]]
paths = ["crates/formalshell-rs/src/instance.rs", "crates/formalshell-rs/src/cmdline.rs"]
runs = ["--instance", "--lock-restore", "--dump"]

[[rule]]
paths = ["crates/formalshell-rs/src/ipc/debug.rs"]
runs = ["--dump", "--render"]

[[rule]]
paths = ["crates/formalshell-rs/src/gpu.rs"]
runs = ["--render", "--menu", "--dump"]

[[rule]]
paths = ["crates/fs-system/src/compositor/keyboard.rs", "crates/formalshell-rs/src/surfaces/bar/cells/keyboard_layout.rs"]
runs = ["--bar-layout"]

[[rule]]
paths = ["crates/fs-system/src/dualsense.rs", "crates/formalshell-rs/src/surfaces/panel/dualsense.rs", "crates/formalshell-rs/src/surfaces/bar/cells/dualsense.rs"]
runs = ["--gallery"]

[[rule]]
paths = ["crates/fs-system/src/**"]
runs = ["--gpu", "--monitor"]

# The legs' own helpers
[[rule]]
paths = ["dev/bluez-stub.py"]
runs = ["--idle --bluez-rssi"]

[[rule]]
paths = ["dev/vpointer.py"]
runs = ["--wheel", "--toast-swipe", "--radio-atlas", "--launcher-mouse"]

[[rule]]
paths = ["dev/lockpointer.py"]
runs = ["--fullscreen"]

[[rule]]
paths = ["dev/sni-stub.py"]
runs = ["--tray", "--tray-overflow"]

[[rule]]
paths = ["dev/librepods-stub.py"]
runs = ["--earbuds", "--headset-card"]

[[rule]]
paths = ["dev/gen-emoji.sh"]
runs = ["--emoji"]

[[rule]]
paths = ["dev/smoke.d/fixtures/flake/**"]
runs = ["--systemupdate"]

[[rule]]
paths = ["crates/fs-menu/src/search.rs", "crates/fs-menu/data/default-menu.jsonc"]
runs = ["--menu", "--menu-rows", "--launcher-abbrev", "--launcher-modes", "--logind-lock"]

[[rule]]
paths = ["crates/fs-menu/src/abbrev.rs", "dev/smoke.d/launcher_abbrev.sh"]
runs = ["--launcher-abbrev"]

[[rule]]
paths = ["crates/fs-menu/data/emoji.json"]
runs = ["--emoji"]

[[rule]]
paths = ["crates/fs-menu/src/thumbnails.rs"]
runs = ["--picker"]

[[rule]]
paths = ["crates/fs-menu/src/toggles.rs"]
runs = ["--toggles", "--menu-actions"]

[[rule]]
paths = ["crates/formalshell-rs/data/countries.json"]
runs = ["--radio-atlas"]

[[rule]]
paths = ["crates/fs-info/src/clock.rs"]
runs = ["--bar-layout", "--desktop-clock"]

[[rule]]
paths = ["crates/fs-info/src/usage.rs", "crates/fs-devices/src/tailscale.rs"]
runs = ["--panel audio"]

# The VM rig's own driver: one run there and one on the rig beside it.
[[rule]]
paths = ["dev/vm.sh"]
runs = ["--wifi", "--menu"]

# The sidebar: the bar's body under layout sidebar, its cards and minimap.
[[rule]]
paths = ["crates/formalshell-rs/src/surfaces/sidebar/", "crates/formalshell-rs/src/ipc/sidebar.rs", "dev/smoke.d/sidebar.sh"]
runs = ["--sidebar", "--sidebar --light", "--minimap", "--sidebar-software", "--sidebar-activity"]

# The status card's tray button and the second bar it opens off the column.
[[rule]]
paths = ["crates/formalshell-rs/src/surfaces/sidebar/mod.rs", "dev/smoke.d/tray.sh", "dev/smoke.d/tray_overflow.sh"]
runs = ["--tray --sidebar", "--tray-overflow --sidebar"]

# Cards budding off the sidebar's inner edge.
[[rule]]
paths = ["crates/formalshell-rs/src/surfaces/sidebar/mod.rs", "crates/formalshell-rs/src/wayland/launcher.rs", "crates/formalshell-rs/src/surfaces/modal.rs"]
runs = ["--sidebar-join", "--sidebar-join --light"]

# The minimap's moves: the keyboard, and the compositor commands they send.
[[rule]]
paths = ["crates/formalshell-rs/src/wayland/sidebar.rs", "crates/formalshell-rs/src/surfaces/sidebar/minimap.rs", "dev/smoke.d/minimap.sh"]
runs = ["--minimap"]

# HyprExpo's overview: the minimap's long press and cross-row drag, the
# compositor command and the IPC verb that open it.
[[rule]]
paths = ["crates/formalshell-rs/src/surfaces/sidebar/minimap.rs", "crates/formalshell-rs/src/services/compositor/hyprland/", "crates/formalshell-rs/src/ipc/workspaces.rs", "dev/smoke.d/overview.sh"]
runs = ["--overview"]

# A subsurface's scale follows its parent's
[[rule]]
paths = ["dev/smoke.d/launcher_density.sh"]
runs = ["--launcher-density"]
