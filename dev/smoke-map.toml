# dev/smoke-affected.py: which smoke runs a change needs. Paths are globs
# from the repo root (`**` crosses directories); runs are lines of
# dev/smoke-all.list, and the selector refuses one that is not there.
#
# A changed file takes the runs of every rule it matches, even under a
# `none` glob. One matching no rule takes the core set, as does anything
# under `shared`. A change to
# dev/smoke.d/<leg>.sh takes every run carrying that leg's flag without a
# rule here. `none` runs nothing: docs, tests, the plans.

# Eight runs across the launcher, a panel, toasts, the lock, the bar, the
# OSD, a real MPRIS player and every component on the gallery sheet.
core = [
  "--menu",
  "--panel audio",
  "--notify",
  "--lock",
  "--bar-layout",
  "--osd",
  "--media",
  "--gallery",
  "--switcher",
]

[none]
paths = [
  "docs/**",
  "**/*.md",
  "LICENSE",
  "branding/**",
  "crates/*/tests/**",
  "crates/**/tests.rs",
  "crates/**/tests/**",
  "dev/smoke-map.toml",
  "dev/smoke-all.list",
  "dev/smoke-affected.py",
  "dev/lint.sh",
  "dev/check.sh",
  "dev/tarball.sh",
  "dev/smoke-greeter.sh",
  "packaging/**",
  "install.sh",
  "scripts/**",
  "tools/**",
  ".github/**",
  "justfile",
  "crates/formalshell-rs/src/greeter/**",
  "crates/formalshell-rs/src/install.rs",
  "crates/fs-auth/src/polkit.rs",
  "crates/fs-network/**",
  "crates/fs-upower/**",
  "crates/fs-bluez/src/agent.rs",
  ".gitignore",
  "crates/*/examples/**",
  "crates/formalshell-rs/src/ipc/golden.rs",
]

# The kit every surface draws with, the theme tables, the wayland core, the
# motion clocks, the render path and the scaffold itself.
[shared]
paths = [
  "crates/formalshell-rs/src/ui/**",
  "crates/formalshell-rs/src/motion.rs",
  "crates/formalshell-rs/src/render.rs",
  "crates/formalshell-rs/src/scene.rs",
  "crates/formalshell-rs/src/text.rs",
  "crates/formalshell-rs/src/fontconfig.rs",
  "crates/formalshell-rs/src/surface.rs",
  "crates/formalshell-rs/src/wayland.rs",
  "crates/formalshell-rs/src/main.rs",
  "crates/formalshell-rs/src/runtime/**",
  "crates/formalshell-rs/src/store.rs",
  "crates/formalshell-rs/src/surfaces/mod.rs",
  "crates/formalshell-rs/src/surfaces/card.rs",
  "crates/formalshell-rs/src/surfaces/modal.rs",
  "crates/formalshell-rs/src/surfaces/popup.rs",
  "crates/formalshell-rs/src/services/mod.rs",
  "crates/formalshell-rs/src/services/config.rs",
  "crates/formalshell-rs/src/services/state.rs",
