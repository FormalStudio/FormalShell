[package]
name = "formalshell-rs"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
async-channel = "2.5"
async-executor = "1.14"
async-io = "2.6"
async-process = "2"
base64 = "0.22"
# Held below 1.7.0, whose idle threads never exit and wake every 500 ms
# (smol-rs/blocking's main_loop exits only past the thread limit).
blocking = "=1.6.2"
calloop = "0.14"
chrono = "0.4"
fs-theme = { version = "0.2.0", path = "../fs-theme" }
futures-lite = "2.6"
fs-chrome = { path = "../fs-chrome" }
fs-system = { path = "../fs-system" }
fs-mpris = { path = "../fs-mpris" }
fs-media = { path = "../fs-media" }
fastrand = "2.5.0"
fs-bluez = { path = "../fs-bluez" }
fs-tray = { path = "../fs-tray" }
fs-audio = { path = "../fs-audio", features = ["pipewire"] }
fs-devices = { path = "../fs-devices" }
fs-network = { path = "../fs-network" }
fs-js = { path = "../fs-js" }
fs-screensaver = { path = "../fs-screensaver" }
fs-upower = { path = "../fs-upower" }
fs-info = { version = "0.2.0", path = "../fs-info" }
fs-notifd = { path = "../fs-notifd" }
fs-activity = { path = "../fs-activity" }
fs-auth = { path = "../fs-auth" }
zeroize = "1.8"
libc = "0.2"
memmap2 = "0.9"
fs-menu = { path = "../fs-menu" }
indexmap = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
zbus = "5"
parley = "0.11"
resvg = { version = "0.45", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skrifa = "0.44"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
vello_cpu = "0.3"
wayland-scanner = "0.31"

[target.'cfg(target_os = "linux")'.dependencies]
yeslogic-fontconfig-sys = "6"
inotify = { version = "0.10", default-features = false }

[dev-dependencies]
tempfile = "3"
