[package]
name = "fs-tray"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
fs-dbus = { path = "../fs-dbus" }
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

serde = { version = "1", features = ["derive"] }

[dev-dependencies]
async-io = "2"
