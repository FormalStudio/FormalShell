[package]
name = "fs-menu"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
fs-devices = { path = "../fs-devices" }
fs-js = { path = "../fs-js" }
chrono = "0.4"
indexmap = { version = "2", features = ["serde"] }
percent-encoding = "2"
regex = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
zeroize = "1.8"
