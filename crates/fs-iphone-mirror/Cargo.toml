[package]
name = "fs-iphone-mirror"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "formalshell-iphone-mirror"
path = "src/main.rs"

[dependencies]
idevice = { version = "0.1.68", default-features = false, features = ["ring", "core_device", "display_stream", "remote_pairing", "rsd", "tunnel_tcp_stack", "mobile_image_mounter", "tss", "xpc"] }
mdns-sd = "0.13"
ed25519-dalek = "2"
libloading = "0.8"
plist = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v3", "v4"] }
