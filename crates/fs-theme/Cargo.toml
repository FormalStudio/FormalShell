[package]
name = "fs-theme"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
fs-js = { path = "../fs-js" }
fs-types = { path = "../fs-types" }
fs-wm-proto = { path = "../fs-wm-proto" }
chrono = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
