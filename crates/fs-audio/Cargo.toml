[package]
name = "fs-audio"
version = "0.2.0"
edition = "2024"
publish = false

[features]
# The PipeWire client links libpipewire through bindgen, which neither the mac
# nor the pure-crate test derivation carries; the model builds everywhere.
pipewire = ["dep:pipewire", "dep:async-channel"]

[dependencies]
async-channel = { version = "2.5", optional = true }
pipewire = { version = "0.10.1", optional = true }
serde_json = "1"

[[example]]
name = "fs-audio-probe"
required-features = ["pipewire"]
