# FormalShell for mango 0.18. Source it from ~/.config/mango/config.conf:
#
#   source=./formalshell.conf
#
# Window rounding, gaps, borders, blur and shadows follow the shell's theme:
# ThemeEngine writes formalshell-colors.conf (focus, border, urgent and
# shadow colours off the wallpaper palette) and formalshell-chrome.conf
# (border_radius, border_px, the four gaps, blur, blur_layer and the shadow
# numbers) beside this file and runs `reload_config` after each write, since
# mango does not watch sourced files. Both are absent until the shell's
# first run, which source_optional tolerates. Keep them below your own
# values for these keys if the theme should win.
source_optional=./formalshell-colors.conf
source_optional=./formalshell-chrome.conf

# The shell animates its own surfaces (DESIGN.md section 1 Motion), so a
# compositor animation on its layers would run a second one over the top.
layer_rule=no_animation:1,layer_name:^formalshell..*$

# The quake console (`console toggle`) parks on the special tag (0) and is
# placed as a floating window wherever it drops down.
window_rule=is_floating:1,app_id:^dev\.formalshell\.console$

# docs/USAGE.md spells the same invocation out for every other target.
# `spawn` splits its line like a shell would but runs no shell, so anything
# chaining two commands goes through `spawn_shell`.

# UTILITIES
bind=SUPER,space,spawn,formalshell-ipc call menu toggle
bind=SUPER+ALT,space,spawn,formalshell-ipc call menu summon apps
bind=SUPER+CTRL,e,spawn,formalshell-ipc call menu summon emoji
bind=SUPER+CTRL,c,spawn,formalshell-ipc call menu summon capture
bind=SUPER+CTRL,o,spawn,formalshell-ipc call menu summon toggles
bind=SUPER+CTRL,s,spawn,formalshell-ipc call menu summon share
bind=SUPER+CTRL,r,spawn,formalshell-ipc call menu summon reminder
bind=SUPER,Escape,spawn,formalshell-ipc call menu summon system
bind=SUPER,k,spawn,formalshell-ipc call menu summon keybinds
bind=SUPER+CTRL,q,spawn,formalshell-ipc call menu summon calc
bind=SUPER+CTRL,m,spawn,formalshell-ipc call mirror toggle
bind=SUPER+CTRL,space,spawn,formalshell-ipc call menu summon wallpaper
bind=SUPER+SHIFT+CTRL,space,spawn,formalshell-ipc call menu summon theme

# Panels by name.
bind=SUPER,s,spawn,formalshell-ipc call panel toggle quicksettings
bind=SUPER+CTRL,a,spawn,formalshell-ipc call panel toggle audio
bind=SUPER+CTRL,b,spawn,formalshell-ipc call panel toggle bluetooth
bind=SUPER+CTRL,w,spawn,formalshell-ipc call panel toggle network
bind=SUPER+CTRL,p,spawn,formalshell-ipc call panel toggle power
bind=SUPER+CTRL,d,spawn,formalshell-ipc call panel toggle display
bind=SUPER+CTRL+ALT,d,spawn,formalshell-ipc call panel toggle calendar

# `panel toggleAt n` opens the nth panel-bearing cell of the bar's right
# region, counted from the screen centre outward.
bind=SUPER+CTRL,1,spawn,formalshell-ipc call panel toggleAt 1
bind=SUPER+CTRL,2,spawn,formalshell-ipc call panel toggleAt 2
bind=SUPER+CTRL,3,spawn,formalshell-ipc call panel toggleAt 3
bind=SUPER+CTRL,4,spawn,formalshell-ipc call panel toggleAt 4
bind=SUPER+CTRL,5,spawn,formalshell-ipc call panel toggleAt 5
bind=SUPER+CTRL,6,spawn,formalshell-ipc call panel toggleAt 6
bind=SUPER+CTRL,7,spawn,formalshell-ipc call panel toggleAt 7
bind=SUPER+CTRL,8,spawn,formalshell-ipc call panel toggleAt 8
bind=SUPER+CTRL,9,spawn,formalshell-ipc call panel toggleAt 9

bind=SUPER,comma,spawn,formalshell-ipc call notifications dismissOne
bind=SUPER+SHIFT,comma,spawn,formalshell-ipc call notifications dismissAll
bind=SUPER+ALT,comma,spawn,formalshell-ipc call notifications invokeLast
bind=SUPER+SHIFT+ALT,comma,spawn,formalshell-ipc call notifications showHistory
bind=SUPER+CTRL,comma,spawn,formalshell-ipc call notifications toggleDnd

bind=SUPER+CTRL,i,spawn,formalshell-ipc call caffeinate toggle
bind=SUPER+CTRL,n,spawn,formalshell-ipc call nightlight toggle
bind=SUPER+CTRL+SHIFT,n,spawn,formalshell-ipc call overnight toggle
bind=SUPER+SHIFT,space,spawn,formalshell-ipc call bar chevron toggle
bindl=SUPER+CTRL,l,spawn,formalshell-ipc call lock lock

# The window switcher: Alt+Tab walks the card, the Alt release commits.
bind=ALT,Tab,spawn,formalshell-ipc call switcher next
bind=ALT+SHIFT,Tab,spawn,formalshell-ipc call switcher prev
bindr=ALT,Alt_L,spawn,formalshell-ipc call switcher commit
bindr=ALT,Alt_R,spawn,formalshell-ipc call switcher commit

bind=NONE,Print,spawn,formalshell-ipc call screenshot pick smart default
bind=SUPER+CTRL,Print,spawn,formalshell-ipc call capture text
bind=ALT,Print,spawn,formalshell-ipc call record toggle screen none

# MEDIA. `l` keeps them live while the screen is locked.
bindl=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && formalshell-ipc call osd volume
bindl=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && formalshell-ipc call osd volume
bindl=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && formalshell-ipc call osd volume
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessUp,spawn_shell,brightnessctl -q set 5%+ && formalshell-ipc call osd brightness
bindl=NONE,XF86MonBrightnessDown,spawn_shell,brightnessctl -q set 5%- && formalshell-ipc call osd brightness
bindl=NONE,XF86AudioPlay,spawn,formalshell-ipc call media playPause
bindl=NONE,XF86AudioPause,spawn,formalshell-ipc call media playPause
bindl=NONE,XF86AudioNext,spawn,formalshell-ipc call media next
bindl=NONE,XF86AudioPrev,spawn,formalshell-ipc call media previous

# CLIPBOARD
bind=SUPER+CTRL,v,spawn,formalshell-ipc call menu summon clipboard
