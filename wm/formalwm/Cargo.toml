[package]
name = "formalwm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
formalwm-core = { path = "../core" }
fs-wm-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
shojiwm_rs = { git = "https://github.com/FormalSnake/ShojiWM.git", rev = "f011672430f31d0ee97b554bd1bec380957ea92d" }
tracing = "0.1"

# The headless session of src/headless.rs: the compositor's state and a
# client to connect to it.
[dev-dependencies]
shojiwm_lib = { git = "https://github.com/FormalSnake/ShojiWM.git", rev = "f011672430f31d0ee97b554bd1bec380957ea92d" }
smithay = { git = "https://github.com/bea4dev/smithay.git", rev = "c1253794ee2a7c466e88bb20dfdaabb4ccbfb2aa", default-features = false }
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.12", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
