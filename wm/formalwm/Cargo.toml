[package]
name = "formalwm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
formalwm-core = { path = "../core" }
fs-wm-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
shojiwm_rs = { path = "../../../../../ShojiWM-wt/rs-sdk/src/shojiwm_rs" }
tracing = "0.1"

# The headless session of src/headless.rs: the compositor's state and a
# client to connect to it.
[dev-dependencies]
shojiwm_lib = { path = "../../../../../ShojiWM-wt/rs-sdk/src/shojiwm_lib" }
smithay = { git = "https://github.com/bea4dev/smithay.git", rev = "c1253794ee2a7c466e88bb20dfdaabb4ccbfb2aa", default-features = false }
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.12", features = ["client"] }
