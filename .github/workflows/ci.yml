name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config clang libclang-dev \
            libpipewire-0.3-dev libpam0g-dev libfontconfig-dev libxkbcommon-dev libwayland-dev
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - run: dev/lint.sh
