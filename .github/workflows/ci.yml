name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config clang libclang-dev \
            libpipewire-0.3-dev libpam0g-dev libfontconfig-dev libxkbcommon-dev libwayland-dev
          cd crates && rustup toolchain install
      - run: dev/lint.sh
